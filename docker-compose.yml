services:
  # Primary Development Test Container with Security Guardrails
  dev-runner:
    build:
      context: ./build
      args:
        - ALPINE_VERSION=${ALPINE_VERSION:-3.20}
        - DEV_UID=${DEV_UID:-1824}
        - DEV_GID=${DEV_GID:-1824}
    image: spike-dev-runner:local
    container_name: spike-dev-runner
    hostname: spike-dev-runner
    
    # Security Guardrails
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    
    # Writable tmpfs scratchpads required for read_only rootfs
    # Note: mode=1777 is essential because tmpfs defaults to root:root 0755
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /app/temp:rw,size=128m,mode=1777
      - /app/logs:rw,size=128m,mode=1777

    volumes:
      # Read-only configuration mount
      - ./config/application.properties:/app/config/application.properties:ro
      
      # Read-write source code package mount
      - ./packages/SamplePackage:/app/packages/SamplePackage:rw

  # Sweeper / Janitor Tool: Namespace-Aware Permission Normalization
  sweeper:
    image: alpine:3
    container_name: spike-dev-sweeper
    profiles:
      - sweeper
      - tools
    environment:
      - DEV_UID=${DEV_UID:-1000}
      - DEV_GID=${DEV_GID:-0}
    volumes:
      - ./packages:/workspace/packages:rw
    command: >
      sh -c "
        echo '=== Sweeper: Detecting User Namespace Translation ===';
        IS_USERNS=0;
        if [ -f /proc/self/uid_map ]; then
          MAPPED_UID=\$$(awk '$$1 == 0 {print $$2}' /proc/self/uid_map 2>/dev/null);
          if [ -n \"\$$MAPPED_UID\" ] && [ \"\$$MAPPED_UID\" -ne 0 ]; then
            IS_USERNS=1;
            echo \"[INFO] Rootless User Namespace detected (guest UID 0 maps to host UID \$$MAPPED_UID).\";
          fi;
        fi;
        if [ \"\$$IS_USERNS\" -eq 1 ]; then
          TARGET_UID=0;
          TARGET_GID=0;
          echo \"[INFO] Using rootless target ownership 0:0 (translates to host UID \$$MAPPED_UID on filesystem).\";
        else
          TARGET_UID=\$${DEV_UID:-1000};
          TARGET_GID=\$${DEV_GID:-0};
          echo \"[INFO] Standard/Host target ownership: \$$TARGET_UID:\$$TARGET_GID.\";
        fi;
        chown -R \$$TARGET_UID:\$$TARGET_GID /workspace/packages;
        chmod -R u+rwX,g+rwX,o+rwX /workspace/packages;
        echo '=== Sweeper: Permissions successfully normalized ===';
      "
